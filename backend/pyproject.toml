[project]
name = "daily-slop-backend"
version = "0.1.0"
description = "The Daily Slop v2 — agentic backend (FastAPI + LangGraph)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "asyncpg>=0.29",
  "greenlet>=3.1",
  "httpx>=0.27",
  "feedparser>=6.0",
  "lxml>=5.0",
  "readability-lxml>=0.8",
  "beautifulsoup4>=4.12",
  "python-slugify>=8.0",
  "tenacity>=9.0",
  # LLM providers
  "anthropic>=0.40",
  "openai>=1.50",
  # LangGraph + LangFuse
  "langgraph>=0.2",
  "langfuse>=2.50",
  # GCP
  "google-cloud-secret-manager>=2.20",
  "google-cloud-storage>=2.18",
  "google-auth>=2.34",
  "google-api-core>=2.20",
  # Logging
  "structlog>=24.4",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "pytest-httpx>=0.32",
  "respx>=0.21",
  "testcontainers[postgres]>=4.8",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-requests",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "ASYNC", "C4", "SIM"]
# B008: FastAPI's `Depends(...)` / `Query(...)` are designed to be used in argument
# defaults, so the warning is a false positive in this codebase.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
exclude = ["alembic/versions", "tests/eval"]

[[tool.mypy.overrides]]
module = ["feedparser", "readability.*", "langfuse.*", "google.cloud.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "eval: judge-LLM eval suite (slow, costs money, nightly only)",
  "integration: requires Postgres testcontainer",
]
addopts = "-ra --strict-markers"
