name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  GCP_PROJECT: daily-slop-v2
  GCP_REGION: europe-west2
  AR_REPO: app
  IMAGE: api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Auth to GCP via WIF
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build & push API image
        working-directory: backend
        run: |
          IMG="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${AR_REPO}/${IMAGE}:${GITHUB_SHA}"
          docker build -t "$IMG" .
          docker push "$IMG"
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform apply
        working-directory: infra/terraform
        run: |
          terraform init -backend-config=envs/prod.backend.hcl
          terraform apply -auto-approve \
            -var-file=envs/prod.tfvars \
            -var "api_image_tag=${IMAGE_TAG}"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE: https://dailyslop.co.uk
        run: |
          pnpm install --frozen-lockfile || pnpm install
          pnpm build

      - name: Sync frontend to GCS
        run: |
          gsutil -m rsync -d -r frontend/dist gs://${GCP_PROJECT}-frontend-prod/

      - name: Invalidate CDN
        run: |
          gcloud compute url-maps invalidate-cdn-cache slop-lb \
            --path "/*" --project ${GCP_PROJECT} --async
